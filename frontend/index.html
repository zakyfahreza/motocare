<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'self'; form-action 'self'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#c2410c">
  <meta name="description" content="Catatan servis, ganti oli, dan belanja part motor">
  <title>MotoCare</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#app">Lewati ke konten</a>

  <header class="app-header" id="app-header" hidden>
    <a class="brand" href="#/" aria-label="MotoCare, ke beranda">
      <img src="assets/icon.svg" alt="" width="28" height="28">
      <span>MotoCare</span>
    </a>
    <div class="motor-switch">
      <label class="visually-hidden" for="motor-select">Motor aktif</label>
      <select id="motor-select"></select>
      <span class="motor-odo" id="motor-odo" aria-live="polite"></span>
    </div>
  </header>

  <nav class="app-nav" id="app-nav" aria-label="Navigasi utama" hidden>
    <a href="#/" data-nav="home">
      <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg></span>
      <span>Beranda</span>
    </a>
    <a href="#/records" data-nav="records">
      <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg></span>
      <span>Riwayat</span>
    </a>
    <a href="#/records/new" data-nav="new" class="nav-add">
      <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
      <span>Tambah</span>
    </a>
    <a href="#/reminders" data-nav="reminders">
      <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></span>
      <span>Pengingat</span>
    </a>
    <a href="#/more" data-nav="more">
      <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg></span>
      <span>Lainnya</span>
    </a>
  </nav>

  <main id="app" class="app-main" tabindex="-1">
    <noscript><p class="card">MotoCare membutuhkan JavaScript.</p></noscript>
  </main>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
</body>
</html>
